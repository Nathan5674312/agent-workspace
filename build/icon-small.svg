<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Fate — the 16px and 24px hint. Same mark as build/icon.svg, drawn for a
    tile that is sixteen pixels across.

    WHY A SEPARATE FILE. One master resampled to 16px loses the rim entirely and
    softens the thread into a grey smear that reads as dirt on the taskbar.
    Three differences, each measured at 16px rather than reasoned about:

      - NO RIM. A 4px frame at 1024 is a quarter of a pixel at 16 and renders as
        a uniform haze around the whole tile, which looks like a rendering fault
        rather than an edge.
      - NO GROUND GRADIENT. Across 16 pixels a three-stop gradient is banding,
        not depth. Flat mid-tone is honest at this size.
      - THICKER THREAD, SMALLER DISC. 58 and r194 at 1024 are 0.9px and 3px at
        16. The thread disappears and the disc swallows the tile. 118 and r140
        hold the same relationship at the size that gets seen.

    Colours are rewritten per theme by scripts/make-icons.mjs, exactly as in
    icon.svg. Keep the property names identical in both files.
  -->
  <style>
    :root {
      --ground-mid: #1a0f09;
      --mark: #f0cba5;
    }
  </style>

  <defs>
    <clipPath id="squircle-s">
      <rect x="34" y="34" width="956" height="956" rx="215" ry="215"/>
    </clipPath>
    <!-- Wider gap than the master: at 16px anti-aliasing bleeds further in
         proportional terms, so +18 closes up and the disc grows a beard. -->
    <mask id="thread-gap-s">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="212" fill="#000"/>
    </mask>
  </defs>

  <rect x="34" y="34" width="956" height="956" rx="215" ry="215" fill="var(--ground-mid)"/>

  <g clip-path="url(#squircle-s)">
    <rect x="272" y="232" width="480" height="72" rx="36" fill="var(--mark)"/>
    <rect x="272" y="720" width="480" height="72" rx="36" fill="var(--mark)"/>
    <path d="M 322 312 L 702 312 L 512 502 Z" fill="var(--mark)"/>
    <path d="M 322 712 L 702 712 L 512 522 Z"
          fill="none" stroke="var(--mark)" stroke-width="76" stroke-linejoin="round"/>
  </g>
</svg>
