<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Fate — application icon. THIS FILE IS THE SOURCE; build/icon.png,
    build/icon.ico and build/themed/*.png are generated from it by
    `npm run icons`. Edit here, never there. It must stay valid XML, not merely
    valid HTML: an SVG loaded as an image is parsed strictly, and a mismatched
    tag fails as a bare "the SVG failed to decode" with nothing naming the line.

    THE MARK is one thread and one stop. It replaced a three-stop zigzag that
    was right about the idea and wrong about the size: at 24px the three stops
    fused into a lumpy bar and the mark stopped being anything. One disc and one
    line survive 16px, which is the size that actually gets seen — in a taskbar,
    a task switcher, and the top-left corner of the app's own title bar.

    What it means is unchanged. The thread is cut off by BOTH edges of the
    frame: the walk started before this frame and continues after it, which is
    the product — cards are files, edges are the order an agent walks them. The
    disc is the one you are in. A closed shape would say "three connected
    things", which is the generic knowledge-graph glyph and says nothing.

    COLOUR IS NOT FIXED HERE. The two custom properties below are rewritten per
    theme by scripts/make-icons.mjs, which reads the real values out of
    src/renderer/tokens.css and src/renderer/themes.css. They are never
    duplicated into a script or into src/shared/themes.ts — that file is a list
    of ids and words for exactly this reason. The values in this file are the
    Founder's palette, so the file standing alone renders the default icon.
  -->
  <style>
    :root {
      --ground-top: #2b1a0d;
      --ground-mid: #1a0f09;
      --ground-bot: #120a06;
      --mark: #f0cba5;
    }
  </style>

  <defs>
    <!-- Ground is not flat: a lift at the top separates the tile from a dark
         taskbar without introducing a second hue. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--ground-top)"/>
      <stop offset="0.55" stop-color="var(--ground-mid)"/>
      <stop offset="1" stop-color="var(--ground-bot)"/>
    </linearGradient>

    <!-- The frame keeps the tile off a same-dark background edge. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--mark)" stop-opacity="0.22"/>
      <stop offset="1" stop-color="var(--mark)" stop-opacity="0.04"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect x="34" y="34" width="956" height="956" rx="215" ry="215"/>
    </clipPath>

    <!--
      Punches the thread out around the disc so it does not run visibly through
      it. A ground-coloured disc painted underneath was tried on the previous
      mark and is wrong: the ground is a gradient, so a flat fill reads lighter
      at the bottom and darker at the top. Masking removes pixels rather than
      repainting them, so the gap is exactly whatever the gradient is there.

      Radius is the disc's own plus 58. The gap has to grow with the thread's
      width, not with the disc's radius: it is the thread's half-width plus a
      constant, because what is being cleared is the stroke, not the circle.
    -->
    <mask id="thread-gap">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="204" fill="#000"/>
    </mask>
  </defs>

  <rect x="34" y="34" width="956" height="956" rx="215" ry="215" fill="url(#ground)"/>

  <g clip-path="url(#squircle)">
    <!-- An hourglass: Fate, and the one shape that survives 16px because its
         silhouette is unmistakable at any size. Caps are bars, not outlines, so
         nothing here is a hairline that vanishes when downsampled.

         The top is SOLID and the bottom is HOLLOW — sand not yet fallen, the
         step not taken. That is the same idea the previous mark carried in a
         hollow ring, kept because it is the honest thing to say about a tool
         whose whole model is a path partly walked. -->
    <rect x="286" y="242" width="452" height="56" rx="28" fill="var(--mark)"/>
    <rect x="286" y="726" width="452" height="56" rx="28" fill="var(--mark)"/>
    <path d="M 330 306 L 694 306 L 512 500 Z" fill="var(--mark)"/>
    <path d="M 330 718 L 694 718 L 512 524 Z"
          fill="none" stroke="var(--mark)" stroke-width="52" stroke-linejoin="round"/>
  </g>

  <rect x="36" y="36" width="952" height="952" rx="213" ry="213"
        fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
